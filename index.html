<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="theme-color" content="#060C17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: cabeçalho com navegação em pílula + barra lateral de negócios + cards de vidro. Paleta azul-noite, predominando a 1ª: #0B1424 (base), #1E3550 (cards), #4E7392 (secundário), #8FAEC6 (destaque), #C9DBE8 (detalhes). */
  --bg:#060C17; --panel:rgba(18,32,52,.42); --solid:#13213A; --sunk:rgba(201,219,232,.05); --ink:#E6EEF5; --ink-2:#A9BED0; --ink-3:#6E86A0; --line:rgba(201,219,232,.10);
  --accent:#8FAEC6; --accent-2:#C9DBE8; --accent-soft:rgba(143,174,198,.16); --on-accent:#0B1424; --cyan:#C9DBE8;
  --grad:linear-gradient(135deg,#C9DBE8 0%,#8FAEC6 55%,#4E7392 100%);
  --btn:rgba(201,219,232,.07); --btn-ink:#E6EEF5;
  --good:#7FD3A6; --good-soft:rgba(127,211,166,.13); --warn:#E8C06B; --warn-soft:rgba(232,192,107,.14); --crit:#FF8A8A; --crit-soft:rgba(255,138,138,.14);
  --s1:#6FA4E0; --s2:#E0905A; --s3:#5FBE96; --s4:#D8B04E; --s5:#D98AB0; --s6:#86B866; --s7:#A79BEA; --s8:#E77C7C;
  --bar-a:#8FAEC6; --hatch-a:#6E86A0; --hatch-b:#1E3550;
  --f:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:22px; --r-sm:14px;
  --glass:blur(22px) saturate(130%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 420px at 90% -15%,rgba(59,123,255,.10) 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.015em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
svg.i{width:18px;height:18px;flex:none}
/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100%}
.hdr{display:flex;align-items:center;gap:14px;padding:16px 24px 8px}
.pillbox{background:var(--panel);border-radius:999px;display:flex;align-items:center;padding:6px;gap:2px;border:1px solid var(--line)}
.logo{padding:6px 16px 6px 6px;gap:9px;font-weight:600;font-size:14.5px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.logo:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.logo-m{width:32px;height:32px;border-radius:50%;background:#000;border:1px solid var(--line);color:var(--accent-2)!important;font-weight:700;font-size:15px;display:grid;place-items:center;color:#fff}
.logo-m svg{width:17px;height:17px}
.tabs{margin:0 auto;overflow-x:auto;max-width:100%;min-width:0;flex:0 1 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 16px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;position:relative}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a.on{background:var(--btn);color:var(--btn-ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tabs .bd{position:absolute;top:3px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.icobtn{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);position:relative;text-decoration:none}
.icobtn:hover{background:var(--sunk)}
.icobtn .bd{position:absolute;top:6px;right:7px;min-width:15px;height:15px;padding:0 3px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel)}
.who{padding:5px 12px 5px 5px;gap:10px;cursor:pointer;position:relative;border:1px solid var(--line);background:var(--panel)}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--c,var(--btn));color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px}
.who .av.me{background:#000;color:var(--accent-2);border:1px solid var(--line)}
.who .av.me svg{width:17px;height:17px}
.menu .mh{padding:8px 10px 4px;display:flex;flex-direction:column;gap:2px}
.menu .mh b{font-weight:600}
.menu .mh small{color:var(--ink-3);font-size:12px}
.menu .mlbl{font-size:11.5px;color:var(--ink-3);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.06em}
.who b{display:block;font-weight:600;font-size:13px;line-height:1.2;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--ink-3);font-size:11.5px;display:block;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:6px;min-width:220px;z-index:40;display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.menu button:hover{background:var(--sunk)}
.menu button.on{background:var(--sunk);font-weight:600}
.menu kbd{margin-left:auto;font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-family:var(--f)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.rel{position:relative}
.body{flex:1;display:flex;gap:18px;padding:12px 24px 0 24px;min-height:0}
.rail{display:flex;flex-direction:column;gap:12px;width:50px;flex:none;padding-bottom:24px}
.rail .grp{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.rail .grp.mid{flex:0 1 auto;overflow-y:auto}
.rail .grp.mid::-webkit-scrollbar{display:none}
.rail .sp{flex:1}
.rb{width:36px;height:36px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:11.5px;flex:none;text-decoration:none}
.rb:hover{background:var(--sunk);color:var(--ink)}
.rb.on{background:var(--btn);color:var(--accent-2)}
.rb.area{background:color-mix(in srgb,var(--c) 16%,var(--panel));color:var(--c)}
.rb.area.on{background:var(--c);color:#fff;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.view{flex:1;overflow:auto;padding:0 2px 40px;min-width:0}
.banner{margin:0 0 14px;padding:10px 16px;border-radius:14px;background:var(--warn-soft);color:var(--ink);font-size:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner span{flex:1 1 260px}
.banner.error{background:var(--crit-soft)}
.banner.approval,.banner.connect{background:var(--accent-soft)}
.sbdot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.sbdot.bad{background:var(--warn)}

/* seletor de negócios */
.shell::before{content:"";display:block;height:3px;background:var(--ctx,transparent);transition:background .3s}
.abar{display:flex;gap:10px;overflow-x:auto;margin:0 0 18px;padding:2px 2px 4px;scroll-snap-type:x proximity}
.abar::-webkit-scrollbar{height:6px}.abar::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.acard{flex:0 0 auto;width:220px;display:grid;grid-template-columns:40px 1fr;gap:8px 10px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink);position:relative;scroll-snap-align:start;transition:border-color .15s,background .15s,transform .15s}
.acard:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));transform:translateY(-1px)}
.acard .aav{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.acard .aav svg{width:18px;height:18px}
.acard .anm{min-width:0;display:flex;flex-direction:column}
.acard .anm b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .anm small{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .ast{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px;white-space:nowrap}
.acard .ast span{overflow:hidden;text-overflow:ellipsis}
.acard .ast .bad{color:var(--crit)}
.acard.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel));box-shadow:inset 0 0 0 1px var(--c)}
.acard.on::after{content:"Ativo";position:absolute;top:10px;right:12px;font-size:10px;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.acard.on .anm{padding-right:34px}
.acard.add{width:auto;border-style:dashed;background:none;grid-template-columns:40px auto}
.acard.add .aav{background:var(--sunk);color:var(--ink-2)}
.ctx{padding:5px 12px 5px 5px;gap:10px;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:var(--panel)}
.ctx .cav{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ctx .cav svg{width:17px;height:17px}
.ctx small{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.ctx b{display:block;font-weight:600;font-size:13px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctxmenu{min-width:290px}
.menu .flag.big{width:30px;height:30px;border-radius:9px;font-size:11px}
.menu .flag.big svg{width:15px;height:15px}
.menu .mi{display:flex;flex-direction:column;min-width:0;flex:1}
.menu .mi b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mi small{font-size:11.5px;color:var(--ink-3)}
.menu .mi em{font-style:normal;color:var(--crit)}
.rail .rb[data-label]{position:relative}
.rail .rb[data-label]:hover::after{content:attr(data-label);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--btn);color:var(--btn-ink);font-size:12px;font-weight:500;padding:5px 10px;border-radius:8px;white-space:nowrap;z-index:30;pointer-events:none;border:1px solid var(--line)}
.rail .grp.mid{overflow:visible}

.mini{display:flex;flex-direction:column;background:var(--sunk);border-radius:14px;padding:4px 14px}
.mini div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.mini div:first-child{border-top:0}
.mini b{color:var(--ink);font-weight:600}
.mini b.bad{color:var(--crit)}
/* barra lateral de negócios */
.rail{width:228px;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 10px;margin-bottom:24px;overflow-y:auto}
.sbh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;padding:2px 10px 6px}
.sbl{display:flex;flex-direction:column;gap:2px}
.sbl.foot{border-top:1px solid var(--line);padding-top:8px}
.sbi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink-2);text-decoration:none;position:relative;font:inherit}
.sbi:hover{background:var(--sunk);color:var(--ink)}
.sbi .sav{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff;background:var(--c)}
.sbi .sav svg{width:16px;height:16px}
.sbi .sav.ic{background:var(--sunk);color:var(--ink-2)}
.sbi .snm{flex:1;min-width:0;display:flex;flex-direction:column}
.sbi .snm b{font-weight:500;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbi .snm small{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbi .scnt{font-size:11px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center}
.sbi .scnt.bad{background:var(--crit-soft);color:var(--crit)}
.sbi.on{background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.sbi.on .snm b{font-weight:600}
.sbi.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.sbi.add .sav{background:none;border:1px dashed var(--line);color:var(--ink-3)}
.sbi.add .snm b{color:var(--ink-3)}
.ctxw{display:none}
@media (max-width:1100px){.rail{width:200px}}
/* ---------- tipografia de página ---------- */
.hello{margin:6px 0 22px;display:flex;align-items:center;gap:18px}
.jv{display:block;flex:none;overflow:visible}
.jv .jv-blink{transform-box:fill-box;transform-origin:50% 100%;transition:transform .09s ease-in}
.jv.blink .jv-blink{transform:scaleY(.12)}
.jv .jv-eyes{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.jv .jv-ring{animation:jvglow 3.2s ease-in-out infinite}
.jv-hero{border-radius:50%;box-shadow:0 12px 34px -6px rgba(59,123,255,.35);animation:jvfloat 5s ease-in-out infinite}
.jv-hero.cheer{animation:jvcheer .9s cubic-bezier(.3,.7,.3,1)}
.jv-hero.cheer .jv-blink{animation:jvsquint .9s}
.jv-logo{transition:transform .2s}
.logo:hover .jv-logo{transform:rotate(-8deg) scale(1.06)}
@keyframes jvfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jvglow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes jvcheer{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-12px) scale(1.06) rotate(-4deg)}50%{transform:translateY(0) scale(.97) rotate(3deg)}75%{transform:translateY(-4px) scale(1.02)}100%{transform:translateY(0) scale(1)}}
@keyframes jvsquint{0%,100%{transform:scaleY(1)}30%,60%{transform:scaleY(1.25) translateY(-1px)}}
.hello h1{font-size:36px;line-height:1.1;letter-spacing:-.03em}
.hello p{margin:6px 0 0;color:var(--ink-2);font-size:14.5px}
.page-h{display:flex;align-items:center;gap:10px;margin:6px 0 18px;flex-wrap:wrap}
.page-h h1{font-size:30px;letter-spacing:-.03em;margin-right:auto}
/* ---------- cards ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c4{grid-column:span 4}.c8{grid-column:span 8}.c12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border-radius:var(--r);padding:18px 20px;min-width:0;border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:8px 10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:16px;white-space:nowrap}
.card-h .sub{color:var(--ink-3);font-size:12.5px;flex-basis:100%;margin-top:-6px}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.lbl{font-size:13px;color:var(--ink-2)}
.big{font-size:32px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.delta.dn{background:var(--crit-soft);color:var(--crit)}
.delta.nt{background:var(--sunk);color:var(--ink-2)}
.dline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-top:6px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:#34343A}
.btn.pri:hover{opacity:.88}
.btn.acc{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.acc:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.soft{background:var(--sunk);border-color:transparent}
.btn.soft:hover{background:var(--line)}
.btn.lg{padding:12px 18px;font-size:14px}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--crit)}
.btn.danger.arm{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* carteiras = áreas */
.wallets{background:var(--sunk);border-radius:16px;padding:12px}
.wallets-h{font-size:12.5px;font-weight:600;margin-bottom:10px;display:flex;gap:6px}
.wallets-h span{color:var(--ink-3);font-weight:400}
.wrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.wrow::-webkit-scrollbar{display:none}
.wal{background:var(--panel);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1px solid transparent;min-width:0}
.wal:hover{border-color:var(--line)}
.wal .wt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;min-width:0}
.wal .wt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:700}
.flag svg{width:10px;height:10px}
.mchips .flag{width:22px;height:22px;font-size:9px}
.wal .wv{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
.wal .ws{font-size:10.5px;color:var(--ink-3)}
.wal .wstat{font-size:10.5px;font-weight:600;color:var(--good)}
.wal .wstat.bad{color:var(--crit)}
/* tiles 2x2 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile{background:var(--sunk);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-height:122px;cursor:pointer;text-decoration:none;color:inherit;min-width:0}
.tile:hover{filter:brightness(.98)}
.tile-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.tile-h>span:first-child{overflow:hidden;text-overflow:ellipsis}
.tile-h .ic{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--panel)}
.tile-h .ic svg{width:15px;height:15px}
.tile .big{font-size:clamp(20px,1.85vw,27px);margin-top:auto;white-space:nowrap}
.tile .dline{margin-top:4px;white-space:nowrap;overflow:hidden}
.tile .dline span:last-child{overflow:hidden;text-overflow:ellipsis}
.tile.hot{background:linear-gradient(150deg,#1E1E22,#121214 80%);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent)}
.tile.hot .tile-h{color:var(--ink-2)}
.tile.hot .tile-h .ic{background:var(--accent);border-color:var(--accent);color:#fff}
.tile.hot .dline{color:var(--ink-3)}
.tile.hot .delta{background:var(--accent-soft);color:var(--accent-2)}
/* gráficos */
.chartbox{background:var(--sunk);border-radius:16px;padding:12px 12px 8px}
.chartbox-h{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;margin-bottom:6px}
.chartbox-h .legend{margin:0 0 0 auto}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f)}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .bl{stroke:var(--line);stroke-width:1}
.chart [data-tip]:hover{opacity:.85}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sq{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.sq.hatch{background:repeating-linear-gradient(135deg,var(--hatch-a) 0 2px,var(--hatch-b) 2px 4px)}
#tip{position:fixed;pointer-events:none;background:var(--btn);color:var(--btn-ink);font-size:12px;padding:6px 10px;border-radius:8px;z-index:80;display:none;white-space:nowrap}
/* barra listrada (limite) */
.limit{height:14px;border-radius:99px;background:repeating-linear-gradient(135deg,#2E2E33 0 3px,transparent 3px 7px);overflow:hidden;margin:14px 0 8px}
.limit i{display:block;height:100%;background:var(--accent);border-radius:99px}
.limit-f{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.limit-f b{color:var(--ink);font-weight:600}
/* metas = cartões */
.gcards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,78%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px}
.gcards::-webkit-scrollbar{display:none}
.gc{border-radius:16px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;cursor:pointer;background:var(--sunk);color:var(--ink)}
.gc:nth-child(3n+1){background:#000;color:var(--ink);border:1px solid var(--line)}
.gc:nth-child(3n+2){background:var(--panel);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line))}
.gc .gtop{display:flex;align-items:center;gap:8px}
.gc .gtag{font-size:10.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-2);padding:2px 8px;border-radius:99px}
.gc:nth-child(3n+2) .gtag{background:var(--accent-soft);color:var(--accent-2)}
.gc:nth-child(3n) .gtag{background:var(--panel);color:var(--ink)}
.gc .gpct{margin-left:auto;font-size:12px;opacity:.85}
.gc .gt{font-weight:600;font-size:14px;line-height:1.3}
.gc .gbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
.gc:nth-child(3n+1) .gbar i,.gc:nth-child(3n) .gbar i{background:var(--accent)}
.gc .gbar i{background:var(--accent)!important}
.gc:nth-child(3n) .gbar{background:var(--line)}
.gc .gbar i{display:block;height:100%;background:currentColor;border-radius:99px}
.gc .gf{display:flex;justify-content:space-between;font-size:11px;opacity:.8;gap:8px}
/* tabela de atividades */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tbar h2{font-size:16px;margin-right:auto}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--panel);min-width:0}
.search input{border:0;background:none;padding:9px 0;outline:none;min-width:60px;width:100%}
.search:focus-within{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--panel);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--ink-2);font-size:13px;border-radius:9px}
.seg button.on{background:var(--btn);color:var(--btn-ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tbl{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tbl-sc{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.t thead th{background:var(--sunk);text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:11px 12px;white-space:nowrap}
.t td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--sunk)}
.t .w{font-weight:500}
.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .nw{white-space:nowrap}
.t tr.done .w{text-decoration:line-through;color:var(--ink-3)}
.t tfoot td{font-weight:600}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--ink-3))}
.st.ok{--c:var(--good)}.st.pend{--c:var(--crit)}.st.prog{--c:var(--warn)}.st.wait{--c:var(--ink-3)}
/* linhas genéricas */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t2{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.row .tt{font-weight:500}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.row.done .tt{text-decoration:line-through;color:var(--ink-3)}
.row .right{display:flex;align-items:center;gap:8px;flex:none}
.empty{color:var(--ink-3);font-size:13px;padding:12px 4px}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-3);background:var(--panel);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.chk:hover{border-color:var(--ink)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";width:8px;height:4.5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip i{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none;display:grid;place-items:center;color:#fff;font-size:8px;font-style:normal;font-weight:700}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.p4{background:var(--crit-soft);color:var(--crit)}
.p3{background:var(--accent-soft);color:var(--accent-2)}
.p2{background:var(--sunk);color:var(--ink-2)}
.p1{background:none;color:var(--ink-3);border:1px solid var(--line)}
.due{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.due.late{color:var(--crit);font-weight:600}
.due.today{color:var(--accent-2);font-weight:600}
.rec{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--good)}
.paid{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:0;cursor:pointer;white-space:nowrap}
.paid.y{background:var(--good-soft);color:var(--good)}
.paid.n{background:var(--sunk);color:var(--ink-2)}
.paid.late{background:var(--crit-soft);color:var(--crit)}
.sec-h{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-weight:600;font-size:13px;color:var(--ink-2)}
.sec-h .n{color:var(--ink-3);font-weight:400}
.sec-h.late{color:var(--crit)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp,.sel{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.inp:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:-1px}
/* kpis genéricos */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpis .tile{min-height:110px;cursor:default}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:220px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-soft)}
.kcol-h{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;font-weight:600;font-size:13.5px}
.kcol-h .st{font-weight:600;font-size:13.5px}
.kcol-h .n{color:var(--ink-3);font-weight:400;background:var(--sunk);border-radius:99px;padding:0 8px;font-size:12px}
.kcol-h .btn{margin-left:auto}
.kcard{background:var(--sunk);border-radius:14px;padding:12px;cursor:grab;display:flex;flex-direction:column;gap:8px;border:1px solid transparent}
.kcard:hover{border-color:var(--line);background:var(--panel)}
.kcard.drag{opacity:.4}
.kcard .tt{font-weight:500;overflow-wrap:anywhere}
.kcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .wd{background:var(--sunk);padding:10px;font-size:12px;font-weight:500;color:var(--ink-3)}
.cell{background:var(--panel);min-height:112px;padding:7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cell:hover{background:var(--sunk)}
.cell.out{background:var(--sunk)}
.cell.out .dn{color:var(--ink-3)}
.cell .dn{font-size:12.5px;font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.today .dn{background:var(--accent);color:#fff}
.ci{font-size:11.5px;padding:3px 7px;border-radius:7px;background:color-mix(in srgb,var(--c) 13%,var(--panel));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.ci::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--c);flex:none}
.ci.done{text-decoration:line-through;color:var(--ink-3)}
.ci.ev{font-weight:600}
.more{font-size:11.5px;color:var(--ink-3);padding-left:4px}
/* hábitos */
.hab{display:grid;grid-template-columns:minmax(120px,1fr) repeat(7,36px) 76px;gap:8px;align-items:center}
.hab .hd{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.2}
.hab .hd.today{color:var(--accent-2);font-weight:700}
.hab .nm{font-weight:500;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbox{width:32px;height:32px;border-radius:10px;border:0;background:var(--sunk);cursor:pointer;justify-self:center;padding:0}
.hbox:hover{background:var(--line)}
.hbox.on{background:var(--c,var(--accent))}
.hab .stk{font-size:12px;color:var(--ink-3);text-align:right}
.hab .stk b{font-size:17px;color:var(--ink);font-weight:600}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.g3 .gc{min-height:170px}
/* áreas */
.area{display:flex;align-items:center;gap:12px}
.area .sw{width:40px;height:40px;border-radius:50%;background:var(--c);flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12.5px}
.area .info{flex:1;min-width:0}
.area .info b{display:block;font-weight:600}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,10,25,.65);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:6vh 16px;overflow:auto}
.scrim.open{display:flex}
.modal{background:var(--panel);border-radius:22px;width:min(520px,100%);box-shadow:0 24px 70px rgba(0,0,0,.6);border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;padding:18px 22px 4px}
.modal-h h3{font-size:19px}
.modal-h .btn{margin-left:auto}
.modal form{padding:12px 22px 20px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
#fc-tcvrow[hidden]{display:none!important}
.f label,.flbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.f .inp,.f .sel{width:100%}
textarea.inp{resize:vertical;min-height:70px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-f{display:flex;gap:8px;align-items:center;margin-top:6px}
.modal-f .spc{flex:1}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors label{position:relative;cursor:pointer}
.colors input{position:absolute;opacity:0}
.colors span{display:block;width:28px;height:28px;border-radius:50%;background:var(--c)}
.colors input:checked+span{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.colors input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.cbx{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:90;display:none;max-width:90vw}
.onb{max-width:560px;margin:4vh auto;display:flex;flex-direction:column;gap:14px}
.onb h2{font-size:28px;letter-spacing:-.03em}
.onb p{color:var(--ink-2);margin:0}
.loading{display:grid;place-items:center;height:60vh;color:var(--ink-3)}
@media (max-width:1180px){.c4.wide{grid-column:span 12}.c4{grid-column:span 6}.c8{grid-column:span 12}.stack.c4{grid-column:span 12;display:grid;grid-template-columns:1fr 1fr}}

/* ================= Vidro e luz ================= */
body{background:var(--bg)!important}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;will-change:transform}
.aurora i:nth-child(1){width:620px;height:620px;left:-140px;top:-180px;background:#4E7392;animation:au1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:520px;height:520px;right:-120px;top:10%;background:#8FAEC6;opacity:.28;animation:au2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:560px;height:560px;left:35%;bottom:-260px;background:#1E3550;opacity:.22;animation:au3 30s ease-in-out infinite alternate}
.aurora b{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%)}
@keyframes au1{to{transform:translate(180px,120px) scale(1.15)}}
@keyframes au2{to{transform:translate(-160px,140px) scale(.9)}}
@keyframes au3{to{transform:translate(-200px,-80px) scale(1.1)}}
.shell{position:relative;z-index:1}
.shell::before{position:relative;z-index:2}
/* superfícies de vidro */
.card,.tiles,.kpis,.kcol,.rail,.pillbox,.cal,.menu,.modal,.tbl,.who,.ctx{backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.card,.tiles,.kpis,.kcol,.rail,.pillbox{background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px -30px rgba(0,0,0,.8)}
.menu,.modal{background:rgba(18,17,25,.86)}
.card,.tile,.kcard,.kcol,.gc{position:relative;isolation:isolate}
/* brilho que segue o mouse + borda que reluz */
.card::after,.tile::after,.kcard::after,.kcol::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;z-index:-1;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(143,174,198,.13),transparent 45%)}
.card::before,.tile:not(.hot)::before,.kcard::before,.kcol::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(201,219,232,.75),transparent 45%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.card:hover::after,.tile:hover::after,.kcard:hover::after,.kcol:hover::after,.card:hover::before,.tile:hover::before,.kcard:hover::before,.kcol:hover::before{opacity:1}
/* tipografia */
.hello h1{font-size:40px;letter-spacing:-.035em}
.gtxt{background:linear-gradient(100deg,#C9DBE8 0%,#8FAEC6 55%,#A9C3D8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.page-h h1{font-size:32px;letter-spacing:-.035em}
.big{letter-spacing:-.035em}
/* navegação */
.tabs a.on{background:var(--grad);color:#fff;box-shadow:0 6px 22px -6px rgba(143,174,198,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.tabs a{transition:background .2s,color .2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px -6px rgba(143,174,198,.8)}
.btn{transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-1px)}
.btn.pri,.btn.acc{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(143,174,198,.9),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.pri:hover,.btn.acc:hover{opacity:1;box-shadow:0 12px 30px -10px rgba(143,174,198,1),inset 0 1px 0 rgba(255,255,255,.3);background:var(--grad)}
.btn:not(.pri):not(.acc):not(.danger):not(.ghost){background:rgba(255,255,255,.05)}
.inp,.sel,.search{background:rgba(255,255,255,.04)}
.sel option{background:var(--solid)}
.chk.on{background:var(--grad);border-color:transparent}
.icobtn:hover{background:rgba(255,255,255,.07)}
/* barra lateral */
.sbi{transition:background .2s}
.sbi.on{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),transparent)}
.sbi.on::before{box-shadow:0 0 12px var(--c)}
.sbi .sav{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px -8px var(--c)}
/* blocos de destaque */
.tile{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-2px);filter:none}
.tile .ic{transition:transform .3s}
.tile:hover .ic{transform:rotate(-12deg) scale(1.08)}
.tile.hot{background:radial-gradient(120% 120% at 100% 0%,rgba(201,219,232,.55),transparent 55%),linear-gradient(150deg,#C9DBE8,#8FAEC6 75%);color:#fff;border-color:rgba(255,255,255,.15);box-shadow:0 18px 40px -18px rgba(143,174,198,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.tile.hot .tile-h{color:rgba(255,255,255,.85)}
.tile.hot .tile-h .ic{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:#fff}
.tile.hot .dline{color:rgba(255,255,255,.8)}
.tile.hot .delta{background:rgba(255,255,255,.2);color:#fff}
.tile.hot::after{background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.18),transparent 45%)}
/* progresso com brilho correndo */
.limit i,.prog i,.gc .gbar i{background:var(--grad)!important;position:relative;overflow:hidden;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.limit i::after,.gc .gbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.45) 50%,transparent 80%);transform:translateX(-100%);animation:shimmer 2.8s ease-in-out infinite}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}
.limit{background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 3px,transparent 3px 7px)}
/* metas */
.gc{transition:transform .2s;border:1px solid var(--line)}
.gc:hover{transform:translateY(-3px)}
.gc:nth-child(3n+1){background:rgba(0,0,0,.55)}
.gc:nth-child(3n+2){background:radial-gradient(120% 120% at 100% 0%,rgba(201,219,232,.5),transparent 55%),linear-gradient(150deg,#C9DBE8,#8FAEC6 75%);border-color:rgba(255,255,255,.15);color:#fff}
.gc:nth-child(3n+2) .gbar i{background:#fff!important}
.gc:nth-child(3n){background:rgba(255,255,255,.04)}
/* tabelas e listas */
.t thead th{background:rgba(255,255,255,.035)}
.t tr.click td{transition:background .15s}
.t tr.click:hover td{background:rgba(143,174,198,.07)}
.mini,.chartbox{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04)}
/* kanban e calendário */
.kcard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);transition:transform .2s,background .2s}
.kcard:hover{transform:translateY(-2px);background:rgba(255,255,255,.06)}
.cal{background:rgba(255,255,255,.06)}
.cal .wd{background:rgba(14,13,20,.75)}
.cell{background:rgba(14,13,20,.6)}
.cell:hover{background:rgba(143,174,198,.08)}
.cell.out{background:rgba(10,10,14,.5)}
.cell.today .dn{background:var(--grad);box-shadow:0 0 18px rgba(143,174,198,.8)}
.hbox{transition:transform .15s}
.hbox:hover{transform:scale(1.08)}
.hbox.on{box-shadow:0 0 14px -2px var(--c)}
/* avatar */
.jv-hero{box-shadow:none!important}
.jvw{position:relative;flex:none;display:block;isolation:isolate;margin:16px 0 16px 18px}
.jvw::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,rgba(143,174,198,.55) 0%,rgba(201,219,232,.18) 40%,transparent 68%);z-index:-1;animation:halo 4.5s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.12);opacity:.75}}
/* celular */
#toast,#tip{background:rgba(30,28,42,.95);color:#fff;border:1px solid var(--line);backdrop-filter:var(--glass)}
/* gráfico */
.chart .bar{transform-box:fill-box;transform-origin:50% 100%}
.view.enter .chart .bar{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) + 200ms)}
@keyframes grow{from{transform:scaleY(0)}}
/* entrada da tela */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.view.enter .hello,.view.enter .page-h,.view.enter .dash>*,.view.enter .kpis>*,.view.enter .tiles>*,.view.enter .kanban>*,.view.enter .cal,.view.enter .g3>*,.view.enter #tlist,.view.enter>.card,.view.enter .gcards>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.view.enter .dash>*:nth-child(2),.view.enter .kpis>*:nth-child(2),.view.enter .tiles>*:nth-child(2),.view.enter .kanban>*:nth-child(2),.view.enter .g3>*:nth-child(2){animation-delay:.06s}
.view.enter .dash>*:nth-child(3),.view.enter .kpis>*:nth-child(3),.view.enter .tiles>*:nth-child(3),.view.enter .kanban>*:nth-child(3),.view.enter .g3>*:nth-child(3){animation-delay:.12s}
.view.enter .dash>*:nth-child(4),.view.enter .kpis>*:nth-child(4),.view.enter .tiles>*:nth-child(4),.view.enter .kanban>*:nth-child(4),.view.enter .g3>*:nth-child(4){animation-delay:.18s}
.view.enter .dash>*:nth-child(5){animation-delay:.24s}
.view.enter .dash>*:nth-child(n+6){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}.view.enter *{animation:none!important}.limit i::after,.gc .gbar i::after{display:none}}
@media (max-width:820px){.aurora i{filter:blur(70px);opacity:.3}.hello h1{font-size:30px}.card::before,.card::after{display:none}}

    border:1px solid rgba(201,219,232,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.25),0 16px 40px -12px rgba(0,0,0,.7);

.jvw{cursor:pointer}

  background:linear-gradient(180deg,rgba(20,34,56,.88),rgba(8,15,28,.94));backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);

  <header class="hdr" id="hdr"></header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Áreas"></nav>
    <main class="view" id="view"><div class="loading">Carregando seus dados…</div></main>
  </div>
</div>

<button class="fab" id="fab" data-act="menu" data-m="newmenu" aria-label="Criar novo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg></button>
<div class="lock" id="lock" hidden role="dialog" aria-modal="true" aria-label="Login do Jarvis"></div>

<script src="vendor/supabase.js"></script>
<script>
"use strict";
/* ============ utilidades ============ */
const COLS=["spaces","tasks","events","txs","habits","goals","clients"];
const S={}; COLS.forEach(c=>S[c]=[]);
let READY=false;
const LKEY="central-pfpj-v1";
const ui={view:"painel",space:"all",cal:null,fin:null,tq:"",tstatus:"open",tprio:"all",ffilter:"all",dtab:"tasks",dq:""};

try{const s=localStorage.getItem("central-space");if(s)ui.space=s;}catch(e){}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
function addMonths(s,n){const d=pd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)}
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESL=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const WD=["dom","seg","ter","qua","qui","sex","sáb"];
const WDL=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const brl=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const brlK=v=>{const a=Math.abs(v);if(a>=1e6)return "R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";if(a>=1e3)return "R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil";return "R$ "+Math.round(v)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtDate(s){if(!s)return "";const dd=diff(s,today());if(dd===0)return "Hoje";if(dd===1)return "Amanhã";if(dd===-1)return "Ontem";const d=pd(s);if(dd>1&&dd<7)return WD[d.getDay()]+", "+d.getDate()+" "+MES[d.getMonth()];return d.getDate()+" "+MES[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")}
const ymKey=s=>s.slice(0,7);
const ymLabel=k=>{const[y,m]=k.split("-").map(Number);const s=MESL[m-1];return s[0].toUpperCase()+s.slice(1)+" de "+y};
const ymAdd=(k,n)=>addMonths(k+"-01",n).slice(0,7);

/* ============ dados: Supabase (via conector do Claude) ============ */
const SB={server:"Supabase",tool:"execute_sql",project:"oohiwxfqrddeozdkjrwv",schema:"jarvis"};
/* campo do app -> coluna no banco */
const MAP={
  spaces:{t:"areas",c:{name:"name",short:"short_name",type:"type",cnpj:"cnpj",color:"color",order:"sort_order",example:"example",createdAt:"created_at"}},
  tasks:{t:"tasks",c:{title:"title",spaceId:"area_id",status:"status",priority:"priority",due:"due",time:"due_time",recur:"recur",notes:"notes",doneAt:"done_at",example:"example",createdAt:"created_at"}},
  events:{t:"events",c:{title:"title",spaceId:"area_id",date:"event_date",time:"start_time",end:"end_time",notes:"notes",example:"example",createdAt:"created_at"}},
  txs:{t:"transactions",c:{desc:"description",spaceId:"area_id",kind:"kind",amount:"amount",due:"due",paid:"paid",paidAt:"paid_at",category:"category",recur:"recur",clientId:"client_id",example:"example",createdAt:"created_at"}},
  habits:{t:"habits",c:{name:"name",spaceId:"area_id",done:"done",example:"example",createdAt:"created_at"}},
  goals:{t:"goals",c:{title:"title",spaceId:"area_id",current:"current_value",target:"target_value",unit:"unit",deadline:"deadline",example:"example",createdAt:"created_at"}},
  clients:{t:"clients",c:{name:"name",spaceId:"area_id",contact:"contact",plan:"plan",billing:"billing",monthly:"monthly_value",total:"total_value",months:"months",since:"since_date",start:"start_date",end:"end_date",renewals:"renewals",status:"status",cancelledAt:"cancelled_at",history:"history",notes:"notes",example:"example",createdAt:"created_at"}}
};
const NULLABLE_EMPTY=new Set(["area_id","due","event_date","paid_at","deadline","short_name","since_date","cancelled_at","client_id"]);
const JSONCOL=new Set(["done","history"]);
const BOOLCOL=new Set(["example","paid"]);
const NUMCOL=new Set(["color","sort_order","priority","done_at","created_at","amount","current_value","target_value","monthly_value","total_value","months","renewals"]);
const q=s=>"'"+String(s).replace(/\u0000/g,"").replace(/'/g,"''")+"'";
function lit(col,v){
  if(BOOLCOL.has(col))return v?"TRUE":"FALSE";
  if(JSONCOL.has(col))return q(JSON.stringify(v||(col==="history"?[]:{})))+"::jsonb";
  if(v===undefined||v===null)return "NULL";
  if(NULLABLE_EMPTY.has(col)&&v==="")return "NULL";
  if(NUMCOL.has(col)){const n=Number(v);return isFinite(n)?String(n):"NULL"}
  return q(v);
}
function upsertSQL(col,rec){
  const m=MAP[col];const cols=["id"],vals=[q(rec.id)];
  for(const [f,c] of Object.entries(m.c)){if(f in rec){cols.push(c);vals.push(lit(c,rec[f]))}}
  const upd=cols.filter(c=>c!=="id").map(c=>`${c}=excluded.${c}`).concat(["updated_at=now()","deleted_at=NULL"]).join(",");
  return `insert into ${SB.schema}.${m.t} (${cols.join(",")}) values (${vals.join(",")}) on conflict (id) do update set ${upd}`;
}
function deleteSQL(col,id){return `update ${SB.schema}.${MAP[col].t} set deleted_at=now(),updated_at=now() where id=${q(id)}`}
function fromRow(col,r){
  const o={id:r.id};
  for(const [f,c] of Object.entries(MAP[col].c)){
    let v=r[c];
    if(v===null||v===undefined){if(["due","date","paidAt","deadline","spaceId","time","end","notes","cnpj","category","unit","short"].includes(f))v="";else if(f==="done")v={};else continue}
    if(["amount","current","target","monthly","total","months","renewals"].includes(f))v=Number(v);
    if(typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v)&&["due","date","paidAt","deadline","since","start","end","cancelledAt"].includes(f))v=v.slice(0,10);
    o[f]=v;
  }
  return o;
}
const LOADSQL=`select '@@J@@'||json_build_object(${COLS.map(c=>`'${c}',(select coalesce(json_agg(x),'[]'::json) from ${SB.schema}.${MAP[c].t} x where x.deleted_at is null)`).join(",")})::text||'@@J@@' as j`;
function extractJSON(p){
  let s=p&&typeof p==="object"&&typeof p.result==="string"?p.result:(typeof p==="string"?p:JSON.stringify(p));
  const a=s.indexOf("@@J@@"),b=s.lastIndexOf("@@J@@");
  if(a<0||b<=a)throw {code:"parse",message:"Resposta do Supabase em formato inesperado."};
  let inner=s.slice(a+5,b);
  for(let i=0;i<4;i++){
    try{const v=JSON.parse(inner);if(v&&typeof v==="object")return v;if(typeof v==="string"){inner=v;continue}}catch(e){}
    try{inner=JSON.parse('"'+inner+'"')}catch(e){break}
  }
  throw {code:"parse",message:"Não consegui ler a resposta do Supabase."};
}

/* estado da conexão */
let MCP=null, SBS={state:"loading",msg:""}, LASTSYNC=0;
const LKEY_CACHE="jarvis-cache-v1", LKEY_OUT="jarvis-outbox-v1";
let OUTBOX=[];try{OUTBOX=JSON.parse(localStorage.getItem(LKEY_OUT)||"[]")}catch(e){OUTBOX=[]}
function saveCache(){try{localStorage.setItem(LKEY_CACHE,JSON.stringify({at:Date.now(),data:S}))}catch(e){}}
function saveOut(){try{localStorage.setItem(LKEY_OUT,JSON.stringify(OUTBOX))}catch(e){}}
function loadCache(){try{const o=JSON.parse(localStorage.getItem(LKEY_CACHE)||"null");if(o&&o.data){COLS.forEach(c=>S[c]=Array.isArray(o.data[c])?o.data[c]:[]);LASTSYNC=o.at||0;return true}}catch(e){}return false}

async function sbCall(sql){
  if(!MCP)throw {code:"no_mcp"};
  const r=await MCP.callTool(SB.server,SB.tool,{project_id:SB.project,query:sql},{cache:false});
  return r&&("payload" in r)?r.payload:r;
}
function sbFail(e){
  const code=e&&e.code||"upstream_error";
  const map={
    no_mcp:["offline","Abra o Jarvis pelo Claude para sincronizar com o Supabase. Mostrando os últimos dados salvos neste aparelho."],
    server_not_connected:["connect","O Supabase não está conectado à sua conta. Conecte em claude.ai → Configurações → Conectores."],
    selection_required:["connect","Escolha qual conexão do Supabase o Jarvis deve usar no aviso do Claude."],
    needs_reauth:["connect","A conexão com o Supabase expirou. Reconecte em claude.ai → Configurações → Conectores."],
    not_in_manifest:["approval","O Jarvis precisa da sua permissão para usar o Supabase."],
    approval_required:["approval","O Jarvis precisa da sua permissão para usar o Supabase."],
    blocked_by_policy:["error","Sua organização bloqueou o uso do Supabase por aqui."],
    tool_error:["error","O Supabase recusou a operação"+(e&&e.message?": "+String(e.message).slice(0,160):".")+" Se o projeto estiver pausado, reative-o em supabase.com."],
    server_unavailable:["offline","O Supabase não respondeu agora. Suas alterações ficam guardadas e serão enviadas assim que voltar."],
    parse:["error",e&&e.message||"Resposta inesperada do Supabase."]
  };
  const [state,msg]=map[code]||["offline","Sem conexão com o Supabase no momento. Suas alterações ficam guardadas e serão enviadas depois."];
  SBS={state,msg};schedule();
}
let flushing=false,flushTimer=0;
function queueSQL(sql){OUTBOX.push(sql);saveOut();clearTimeout(flushTimer);flushTimer=setTimeout(flush,120)}
async function flush(){
  if(flushing||!OUTBOX.length||!MCP)return;
  flushing=true;
  const batch=OUTBOX.slice(0,40);
  try{
    await sbCall(batch.join(";\n")+";");
    OUTBOX.splice(0,batch.length);saveOut();
    if(SBS.state!=="ok"){SBS={state:"ok",msg:""};schedule()}
    LASTSYNC=Date.now();
  }catch(e){
    if(e&&e.code==="tool_error"){ /* comando inválido: descarta para não travar a fila */ OUTBOX.splice(0,batch.length);saveOut();toast("Uma alteração não pôde ser salva no Supabase. Recarreguei os dados.");sbLoad()}
    sbFail(e);
  }finally{flushing=false;if(OUTBOX.length&&SBS.state==="ok")setTimeout(flush,50)}
}
async function sbLoad(retried){
  if(!MCP)return;
  try{
    if(OUTBOX.length){await flush();if(OUTBOX.length)return}
    const data=extractJSON(await sbCall(LOADSQL.replace("json_build_object(",`json_build_object('settings',(select coalesce(json_object_agg(key,value),'{}'::json) from ${SB.schema}.settings),`)));
    COLS.forEach(c=>S[c]=(data[c]||[]).map(r=>fromRow(c,r)));
    lockFromServer(data.settings||{});
    READY=true;LASTSYNC=Date.now();SBS={state:"ok",msg:""};saveCache();schedule();
  }catch(e){
    if(e&&e.retryable&&!retried){await new Promise(r=>setTimeout(r,(e.retryAfterMs||800)+Math.random()*700));return sbLoad(true)}
    READY=true;sbFail(e);
  }
}
function put(col,obj){
  const o=JSON.parse(JSON.stringify(obj));if(!o.id)o.id=uid();o.updatedAt=Date.now();
  const arr=S[col];const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o);
  saveCache();schedule();queueSQL(upsertSQL(col,o));
  return o.id;
}
function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(col==="spaces")["tasks","events","txs","habits","goals","clients"].forEach(c=>S[c].forEach(x=>{if(x.spaceId===id)x.spaceId=""}));
  saveCache();schedule();queueSQL(deleteSQL(col,id));
}
async function boot(){
  const had=loadCache();if(had)READY=true;
  if(!LOCK.unlocked){LOCK.mode=LOCK.known?(LOCK.auth?"login":"setup"):"loading"}
  render();renderLock();
  try{if(window.claude&&typeof window.claude.use==="function")MCP=await window.claude.use("mcp")}catch(e){MCP=null}

function jvSummary(nt,nl,ne,pay){
  const parts=[];
  parts.push(nt?`${nt} tarefa${nt>1?"s":""} para hoje`:"nenhuma tarefa para hoje");
  if(nl)parts.push(`${nl} atrasada${nl>1?"s":""}`);
  if(ne)parts.push(`${ne} compromisso${ne>1?"s":""}`);
  let s;
  if(!nt&&parts.length===1)s="Você não tem tarefas para hoje.";
  else if(!nt){parts.shift();s="Nenhuma tarefa para hoje, mas você tem "+parts.join(" e ")+".";}
  else s="Você tem "+parts.slice(0,-1).join(", ")+(parts.length>1?" e ":"")+parts[parts.length-1]+".";
  if(pay>0)s+=` Na semana, ${brl(pay)} a pagar.`;
  return s;
}
const CU={};let CUK=0;
function cu(n,f){const k="c"+(CUK++);return `<span class="cu" data-k="${k}" data-n="${Number(n)||0}" data-f="${f}">${f==="brl"?brl(n):f==="brlK"?brlK(n):Math.round(n)}</span>`}
function runCount(root,entering){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.querySelectorAll(".cu").forEach(el=>{
    const k=ui.view+":"+el.dataset.k, to=+el.dataset.n, f=el.dataset.f;
    const from=entering||!(k in CU)?0:CU[k];CU[k]=to;
    if(reduce||from===to)return;
    const fmt=v=>f==="brl"?brl(v):f==="brlK"?brlK(v):String(Math.round(v));
    const t0=performance.now(),d=entering?1100:600;
    const step=t=>{const p=Math.min(1,(t-t0)/d);const e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};
    el.textContent=fmt(from);requestAnimationFrame(step);
  });
}

function pctDelta(cur,prev){if(!prev)return null;return Math.round((cur-prev)/Math.abs(prev)*100)}

function dashTable(){
  const t=today();const q=ui.dq.trim().toLowerCase();const m=s=>!q||String(s||"").toLowerCase().includes(q);
  if(ui.dtab==="agenda"){
    const evs=S.events.filter(e=>inSp(e)&&e.date>=t&&e.date<=addDays(t,30)&&m(e.title)).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).slice(0,10);
    return evTable(evs);
  }
  if(ui.dtab==="bills"){
    const xs=S.txs.filter(x=>inSp(x)&&m(x.desc)&&(!x.paid&&x.due<=addDays(t,30)||ymKey(x.due)===t.slice(0,7))).sort((a,b)=>(a.paid-b.paid)||a.due.localeCompare(b.due)).slice(0,10);
    return txTable(xs,"",true);
  }
  const open=openTasks().filter(x=>m(x.title));
  const rank=x=>x.due&&x.due<t?0:x.due===t?1:x.status==="doing"?2:x.due?3:4;
  const arr=open.sort((a,b)=>rank(a)-rank(b)||(a.due||"9").localeCompare(b.due||"9")||(b.priority||2)-(a.priority||2)).slice(0,8);
  return taskTable(arr,open.length>8?`<a class="btn sm soft" href="#tarefas" style="margin-top:10px">Ver todas as ${open.length} tarefas</a>`:"");
}

/* ============ gráfico de barras (SVG) ============ */
let chartN=0;
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function rtop(x,y,w,h,r){if(h<=0)return "";r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function barChart(labels,series,o={}){
  const id="hp"+(++chartN);
  const W=o.W||520,H=o.h||180,pl=o.pl||34,pr=4,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=labels.length,k=series.length;
  const rawMax=Math.max(0,...series.flatMap(s=>s.values));const max=rawMax>0?niceMax(rawMax):1000;
  const yf=o.yFmt||(v=>v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+"k":String(Math.round(v)));
  let g=`<defs><pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--hatch-b)"/><rect width="2.4" height="6" style="fill:var(--hatch-a)"/></pattern><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9DBE8"/><stop offset=".55" stop-color="#8FAEC6"/><stop offset="1" stop-color="#4E7392"/></linearGradient></defs>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Gráfico de barras")}">${g}${b}</svg>${leg}`;

function taskList(){
  const t=today();const q=ui.tq.trim().toLowerCase();
  let ts=S.tasks.filter(x=>inSp(x)&&(!q||(x.title+" "+(x.notes||"")).toLowerCase().includes(q))&&(ui.tprio==="all"||String(x.priority||2)===String(ui.tprio)));
  const sorter=(a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||(b.priority||2)-(a.priority||2);
  const open=ts.filter(x=>x.status!=="done").sort(sorter);
  const done=ts.filter(x=>x.status==="done").sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  let out="";
  const sec=(title,arr,cls="")=>arr.length?`<div class="sec-h ${cls}">${title}<span class="n">${arr.length}</span></div>${taskTable(arr)}`:"";
  if(ui.tstatus!=="done"){
    out+=sec("Atrasadas",open.filter(x=>x.due&&x.due<t),"late");
    out+=sec("Hoje",open.filter(x=>x.due===t));
    out+=sec("Próximos 7 dias",open.filter(x=>x.due>t&&x.due<=addDays(t,7)));
    out+=sec("Mais pra frente",open.filter(x=>x.due>addDays(t,7)));
    out+=sec("Sem data",open.filter(x=>!x.due));
  }
  if(ui.tstatus!=="open")out+=sec("Concluídas",done.slice(0,60));
  return `<div class="card">${out.replace(/^<div class="sec-h ([^"]*)"/,'<div class="sec-h $1" style="margin-top:0"')||`<div class="empty">Nenhuma tarefa ${q?"encontrada para “"+esc(ui.tq)+"”":"aqui"}.</div>`}</div>`;
}

const fold=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const GS_SRC=[
  ["clients","Clientes","users",c=>[c.name,c.plan,c.contact,c.notes],c=>`${BILL[c.billing]} · ${CST[cliState(c)][0]} · expira ${pd(c.end).toLocaleDateString("pt-BR")}`],
  ["tasks","Tarefas","check",x=>[x.title,x.notes],x=>`${STATUS[x.status]}${x.due?" · "+fmtDate(x.due):""}`],
  ["events","Compromissos","cal",e=>[e.title,e.notes],e=>fmtDT(e.date,e.time)],
  ["txs","Lançamentos","wallet",x=>[x.desc,x.category],x=>`${x.kind==="in"?"A receber":"A pagar"} · ${brl(x.amount)} · ${fmtDate(x.due)}${x.paid?" · "+(x.kind==="in"?"recebido":"pago"):""}`],
  ["goals","Metas","coins",g=>[g.title],g=>`${(+g.current).toLocaleString("pt-BR")} de ${(+g.target).toLocaleString("pt-BR")} ${esc(g.unit||"")}`],
  ["habits","Hábitos","check",h=>[h.name],h=>`${streak(h)} dias seguidos`]
];
function gsResults(qs){
  const qq=fold(qs).trim();if(!qq)return [];
  const words=qq.split(/\s+/);const out=[];
  GS_SRC.forEach(([col,label,ic,fields,sub])=>{
    S[col].forEach(x=>{const hay=fold(fields(x).filter(Boolean).join(" "));if(words.every(w=>hay.includes(w))){const name=fields(x)[0]||"";out.push({col,label,ic,id:x.id,name,sub:sub(x),sp:x.spaceId,score:(fold(name).startsWith(qq)?0:1)})}})
  });
  return out.sort((a,b)=>a.score-b.score).slice(0,40);
}
function gsRender(){
  const r=document.getElementById("gs-r");if(!r)return;
  const qs=val("gs-q");const res=gsResults(qs);
  if(!qs){r.innerHTML=`<p class="gs-hint">Procure clientes, tarefas, compromissos, contas, metas e hábitos de todos os negócios.</p>`;return}
  if(!res.length){r.innerHTML=`<p class="gs-hint">Nada encontrado para “${esc(qs)}”.</p>`;return}
  let last="";
  r.innerHTML=res.map((x,i)=>{const h=x.label!==last?`<div class="gs-g">${x.label}</div>`:"";last=x.label;
    return h+`<button type="button" class="gs-i ${i===0?"first":""}" data-act="gs-open" data-col="${x.col}" data-id="${x.id}"><span class="al-ic">${svgI(x.ic)}</span><span class="mi"><b>${esc(x.name)}</b><small>${x.sub}</small></span>${x.sp?chip(x.sp):""}</button>`}).join("");
}

/* ============ HISTÓRICO, EVOLUÇÃO E RETENÇÃO ============ */
const cliCycles=c=>[...(Array.isArray(c.history)?c.history:[]),{start:c.start,end:c.end,months:c.months,monthly:c.monthly,total:c.total,billing:c.billing,cur:true}];
const cyMonthly=cy=>cy.billing==="tcv"?(+cy.total||0)/Math.max(1,+cy.months||1):(+cy.monthly||0);
function revenueIn(k,cls){
  const first=k+"-01",last=addDays(addMonths(first,1),-1);let mrr=0,tcv=0;
  (cls||S.clients.filter(inSp)).forEach(c=>cliCycles(c).forEach(cy=>{
    if(!(cy.start<=last&&cy.end>first))return;
    if(cy.cur&&c.status==="cancelled"&&c.cancelledAt&&c.cancelledAt<=first)return;
    if(cy.billing==="tcv")tcv+=cyMonthly(cy);else mrr+=cyMonthly(cy);
  }));
  return {mrr,tcv};
}
function retention(cls){
  const t=today(),t0=addDays(t,-90);
  const activeAt=d=>cls.filter(c=>cliCycles(c).some(cy=>cy.start<=d&&cy.end>d)&&!(c.status==="cancelled"&&c.cancelledAt&&c.cancelledAt<=d));
  const base=activeAt(t0).length;
  const lost=cls.filter(c=>(c.status==="cancelled"&&c.cancelledAt&&c.cancelledAt>t0)||(c.status!=="cancelled"&&c.end<t&&c.end>=t0));
  const renewed=cls.reduce((s,c)=>s+(Array.isArray(c.history)?c.history.filter(h=>h.end>t0&&h.end<=addDays(t,30)).length:0),0);
  const fresh=cls.filter(c=>(c.since||c.start)>t0&&(c.since||c.start)<=t).length;
  return {base,lost,renewed,fresh,churn:base+fresh?Math.min(100,lost.length/(base+fresh)*100):null,renewRate:renewed+lost.length?renewed/(renewed+lost.length)*100:null};
}

const BILL={mrr:"MRR",tcv:"TCV"};
const CST={active:["Ativo","ok"],renewed:["Renovado","ok"],expiring:["Vence logo","pend"],future:["Começa em breve","prog"],expired:["Vencido","late"],cancelled:["Cancelado","wait"]};
function cliState(c){const t=today();if(c.status==="cancelled")return "cancelled";if(c.start>t)return (Array.isArray(c.history)&&c.history.some(h=>h.start<=t&&h.end>t))?"renewed":"future";if(c.end<t)return "expired";if(diff(c.end,t)<=30)return "expiring";return "active"}
const cliMonthly=c=>c.billing==="tcv"?(+c.total||0)/Math.max(1,+c.months||1):(+c.monthly||0);
const cliTotal=c=>c.billing==="tcv"?(+c.total||0):(+c.monthly||0)*(+c.months||0);
function cliCycle(c){const t=today();if(t<c.start)return 0;let m=0;while(m<c.months&&addMonths(c.start,m+1)<=t)m++;return Math.min(c.months,m+1)}
const cliTxs=c=>S.txs.filter(x=>x.clientId===c.id);
const cliLive=c=>["active","expiring","future","renewed"].includes(cliState(c));
function cliDefArea(){if(ui.space!=="all")return ui.space;const cnt={};S.clients.forEach(c=>cnt[c.spaceId]=(cnt[c.spaceId]||0)+1);const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(best&&spaceOf(best[0]))return best[0];const pj=spaces().find(s=>s.type==="pj");return (pj||spaces()[0]||{}).id}
function cliSchedule(c){
  if(c.billing==="tcv")return [{due:c.start,amount:Math.round(cliTotal(c)*100)/100,n:1,of:1}];
  return Array.from({length:c.months},(_,i)=>({due:addMonths(c.start,i),amount:+c.monthly,n:i+1,of:c.months}));
}
function cliLaunch(c,{markPast=true,from=""}={}){
  const t=today();const ids=[];
  cliSchedule(c).filter(s=>!from||s.due>=from).forEach(s=>{
    const paid=markPast&&s.due<=t;
    ids.push(put("txs",{kind:"in",desc:`${c.name} · ${c.billing==="tcv"?`TCV ${c.months} ${c.months>1?"meses":"mês"}`:`MRR ${s.n}/${s.of}`}`,amount:s.amount,due:s.due,spaceId:c.spaceId,category:"Serviços",paid,paidAt:paid?s.due:null,recur:"none",clientId:c.id,createdAt:Date.now()}));
  });
  return ids;
}
function cliDropFuture(c,from){const f=from||today();const gone=cliTxs(c).filter(x=>!x.paid&&x.due>=f);gone.forEach(x=>del("txs",x.id));return gone.length}
function cliWhen(c){const d=diff(c.end,today());if(c.status==="cancelled")return c.cancelledAt?"cancelado "+(diff(c.cancelledAt,today())===0?"hoje":"em "+pd(c.cancelledAt).toLocaleDateString("pt-BR")):"cancelado";if(c.start>today())return (cliState(c)==="renewed"?"novo ciclo ":"começa ")+fmtDate(c.start).toLowerCase();if(d<0)return `venceu há ${-d} dia${d===-1?"":"s"}`;if(d===0)return "vence hoje";return `faltam ${d} dia${d===1?"":"s"}`}

function goalCard(g){
  const sp=spaceOf(g.spaceId);const tgt=+g.target||0,cur=+g.current||0;const pct=tgt?Math.min(100,Math.round(cur/tgt*100)):0;

  return `<div class="gc" data-act="goal-upd" data-id="${g.id}" role="button" tabindex="0" aria-label="Atualizar meta ${esc(g.title)}">

const CHAT_RULES=`Você é o Jarvis, assistente pessoal de um empresário brasileiro que organiza a vida pessoal (PF) e várias empresas (CNPJs) num app com tarefas, compromissos (agenda), contas a pagar/receber, hábitos e metas.

{"reply":"resposta curta em português, tom cordial e direto, no máximo 4 frases ou uma lista curta com •","actions":[ ...zero ou mais ações... ]}

AÇÕES possíveis (use exatamente estes campos):
{"type":"create_task","title":str,"area":idÁrea,"due":"AAAA-MM-DD" ou "","time":"HH:MM" ou "","priority":1-4,"recur":"none|daily|weekly|monthly|yearly","notes":str}
{"type":"create_event","title":str,"area":idÁrea,"date":"AAAA-MM-DD","time":"HH:MM" ou "","end":"HH:MM" ou "","notes":str}
{"type":"create_tx","kind":"out"(pagar) ou "in"(receber),"desc":str,"amount":número,"due":"AAAA-MM-DD","area":idÁrea,"category":str,"recur":"none|monthly","paid":bool}
{"type":"create_habit","name":str,"area":idÁrea ou ""}
{"type":"create_goal","title":str,"area":idÁrea,"current":número,"target":número,"unit":str,"deadline":"AAAA-MM-DD" ou ""}
{"type":"create_client","name":str,"area":idÁrea,"billing":"mrr"(paga por mês) ou "tcv"(paga tudo adiantado),"monthly":valor mensal do pacote,"months":número de meses,"start":"AAAA-MM-DD","total":valor total pago à vista (só tcv; se não disser, mensal×meses),"plan":str,"launch":true(lançar contas a receber)}
{"type":"renew_client","id":idCliente,"months":número (padrão o mesmo),"monthly":número (opcional)}
{"type":"complete_task","id":idTarefa}
{"type":"update_task","id":idTarefa, e só os campos que mudam entre: "title","due","time","priority","status"(todo|doing|waiting|done),"area","notes"}
{"type":"update_event","id":idCompromisso, e só os campos que mudam entre: "title","date","time","end","area","notes"}
{"type":"pay_tx","id":idConta}
{"type":"mark_habit","id":idHábito,"date":"AAAA-MM-DD"}
{"type":"update_goal","id":idMeta,"current":número}

REGRAS:
- Datas relativas ("sexta", "amanhã", "dia 10", "semana que vem") devem ser convertidas usando o CALENDÁRIO dado. Dia da semana sem mais detalhe = a próxima ocorrência a partir de hoje (se for hoje e o horário ainda não passou, é hoje). "Dia 10" = o próximo dia 10.
- Reunião, consulta, call, visita, almoço com alguém = create_event. Algo a fazer/entregar = create_task. Pagar/receber dinheiro = create_tx. Se um compromisso tem hora de início e não tem fim, coloque o fim 1 hora depois.
- Área: use a que o usuário citar (compare com os nomes das ÁREAS; "pessoal", "minha", "casa" = a área de pessoa física). Se ele não citar, use a ÁREA SELECIONADA; se for "todas", use a área de pessoa física para assuntos pessoais e, se for claramente de empresa mas não disser qual, escolha a mais provável e diga qual escolheu na reply.
- Para referir algo existente, use o id dos DADOS. Se houver mais de um candidato e não der para saber, NÃO faça a ação: pergunte na reply qual é.
- Clientes: MRR = cliente que paga o valor todo mês durante o contrato; TCV = paga o contrato inteiro adiantado. "Fechei cliente X no MRR de 1.000 por 6 meses" = create_client. Perguntas sobre base, MRR, TCV ou vencimentos = responda com os dados de CLIENTES.
- Valores em reais: "1.200" = 1200; "1,5 mil" = 1500.
- Prioridade: 4 urgente, 3 alta, 2 média (padrão), 1 baixa.
- Perguntas ("o que tenho hoje?", "quanto vou pagar essa semana?") = responda na reply usando os DADOS, com actions vazio. Seja preciso com números e datas.
- Para apagar, use a ação delete (o app pedirá confirmação ao usuário). Nunca apague sem o usuário pedir.
- Se faltar algo essencial (ex.: valor de uma conta), pergunte na reply e não crie a ação.
- Na reply, confirme em linguagem natural o que foi feito com data no formato "sexta, 27/11 às 15:00". Não mencione ids nem JSON.`;

async function groqThink(turns,signal){

  const payload={model:GROQ.model,reasoning_effort:"low",temperature:0.2,max_completion_tokens:1800,response_format:{type:"json_object"},messages};
  const r=extractJSON(await sbCall(`select '@@J@@'||jarvis.groq_chat(${q(JSON.stringify(payload))}::jsonb)::text||'@@J@@' as j`));
  if(signal&&signal.aborted)throw {code:"cancelled"};
  if(r.error)throw {code:"groq_error",message:r.error};
  if(r.status!==200){const m=r.body&&r.body.error&&r.body.error.message;throw {code:"groq_http",message:(r.status||"")+" "+(m||"")}}

  return parseLooseJSON(content);
}
async function chatThink(turns,signal){

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));

async function pwHash(user,pw,salt,iter){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(normUser(user)+"\u0000"+pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:iter,hash:"SHA-256"},key,256);
  return b64(bits);
}

function lockFail(msg){LOCK.err=true;LOCK.msg=msg;LOCK.shake=true;LOCK.busy=false;renderLock()}
async function lockSubmit(){
  if(LOCK.busy||Date.now()<LOCK.waitUntil)return;
  const v=id=>{const i=document.getElementById(id);return i?i.value:""};
  const user=v("lk-user").trim(),pass=v("lk-pass");
  if(LOCK.mode==="login"){
    if(!user||!pass)return lockFail("Preencha usuário e senha.");
    LOCK.busy=true;renderLock();
    const a=LOCK.auth;
    const ok=a&&normUser(user)===normUser(a.user)&&(await pwHash(user,pass,a.salt,a.iter||150000))===a.hash;
    LOCK.busy=false;
    if(ok){LOCK.tries=0;LOCK.draftUser="";lockOpen();return}
    LOCK.tries++;LOCK.draftUser=user;
    const p=document.getElementById("lk-pass");if(p)p.value="";
    if(LOCK.tries>=5){LOCK.waitUntil=Date.now()+30000*(LOCK.tries-4);LOCK.err=true;LOCK.msg="";LOCK.shake=true;renderLock();return}
    return lockFail(`Usuário ou senha incorretos. ${5-LOCK.tries} tentativa${5-LOCK.tries>1?"s":""} antes de uma pausa.`);
  }
  if(LOCK.mode==="change"){
    const old=v("lk-old");const a=LOCK.auth;
    if(!old)return lockFail("Digite a senha atual.");
    LOCK.busy=true;renderLock();
    const ok=a&&(await pwHash(a.user,old,a.salt,a.iter||150000))===a.hash;
    if(!ok){LOCK.tries++;const o=document.getElementById("lk-old");if(o)o.value="";if(LOCK.tries>=5){LOCK.waitUntil=Date.now()+30000*(LOCK.tries-4);LOCK.busy=false;LOCK.err=true;LOCK.msg="";LOCK.shake=true;renderLock();return}return lockFail("Senha atual incorreta.")}
    LOCK.busy=false;LOCK.tries=0;
  }
  const pass2=v("lk-pass2");
  if(normUser(user).length<3)return lockFail("O usuário precisa ter pelo menos 3 caracteres.");
  if(/\s/.test(user))return lockFail("O usuário não pode ter espaços.");
  if(pass.length<8)return lockFail("A senha precisa ter pelo menos 8 caracteres.");
  if(!/[A-Za-zÀ-ÿ]/.test(pass)||!/[0-9]/.test(pass))return lockFail("Use letras e números na senha.");
  if(pass!==pass2){const p2=document.getElementById("lk-pass2");if(p2)p2.value="";return lockFail("As senhas não batem.")}
  LOCK.busy=true;renderLock();
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));const iter=150000;
  const hash=await pwHash(user,pass,salt,iter);
  const a={user:normUser(user),salt,hash,iter,v:2,setAt:Date.now()};
  const wasChange=LOCK.mode==="change";
  lockSetAuth(a);
  queueSQL(`insert into ${SB.schema}.settings (key,value) values ('auth',${q(JSON.stringify(a))}::jsonb) on conflict (key) do update set value=excluded.value,updated_at=now()`);
  LOCK.busy=false;lockOpen();
  toast(wasChange?"Usuário e senha atualizados.":"Acesso criado. Entre com "+a.user+" e sua senha.");
}

      const {data:{session}}=await SBC.auth.getSession();
      toast(M==="change"?"Senha alterada.":"Senha nova salva.");
      await webEnter(session);
    });
  }
}
async function webEnter(session){
  if(!session){LOCK.mode="login";return}
  WUSER=session.user;try{localStorage.setItem("jarvis-email",WUSER.email||"")}catch(e){}
  const meta=WUSER.user_metadata||{};const full=String(meta.name||meta.full_name||"").trim();
  FULLNAME=full||WUSER.email||"";NAME=full?full.split(/\s+/)[0]:"";
  const {data:cl,error}=await SBC.rpc("jarvis_claim");
  if(error){
    const er=webErr(error);
    if(er.code==="server_unavailable"&&WEB_HAD){WEBOK=true;MCP={web:true};lockOpen();sbFail(er);return}
    LOCK.err=true;LOCK.msg=authMsg(error);LOCK.mode="login";return;
  }
  if(cl!=="owner"){try{await SBC.auth.signOut()}catch(e){}LOCK.mode="denied";LOCK.msg="";return}
  WEBOK=true;MCP={web:true};
  lockOpen();
  await sbLoad();
}
async function boot(){
  WEB_HAD=loadCache();if(WEB_HAD)READY=true;
  LOCK.mode="loading";render();renderLock();
  if(!window.supabase||!window.supabase.createClient){LOCK.mode="error";renderLock();return}
  SBC=window.supabase.createClient(WEB.url,WEB.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit",storageKey:"jarvis-web-auth"}});
  SBC.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){LOCK.unlocked=false;LOCK.mode="newpass";LOCK.msg="";renderLock()}});
  let session=null;try{({data:{session}}=await SBC.auth.getSession())}catch(e){}
  if(WEB_AUTHLINK){history.replaceState(null,"",location.pathname+"#painel");render()}
  if(WEB_RECOVERY&&session){LOCK.unlocked=false;LOCK.mode="newpass";renderLock();return}
  if(session&&(LOCK.unlocked||WEB_AUTHLINK)){await webEnter(session);renderLock()}
  else{
    LOCK.unlocked=false;LOCK.mode="login";
    if(!webEmail()){try{const {data}=await SBC.rpc("jarvis_has_owner");if(data===false)LOCK.mode="signup"}catch(e){}}
    renderLock();
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&WEBOK&&LOCK.unlocked&&Date.now()-LASTSYNC>15000)sbLoad()});
  setInterval(()=>{if(document.visibilityState==="visible"&&WEBOK&&LOCK.unlocked&&!flushing)sbLoad()},90000);
}
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="wa-mode"){LOCK.mode=el.dataset.m;LOCK.msg="";LOCK.err=false;LOCK.show=false;renderLock()}
  else if(a==="wa-cancel"){LOCK.unlocked=true;LOCK.msg="";LOCK.err=false;lockTouch();renderLock();render()}
  else if(a==="wa-logout"){webLogout()}
});

boot();
</script>
